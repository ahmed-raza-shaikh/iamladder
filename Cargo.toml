[package]
name = "iamladder"
version = "0.1.0"
edition = "2024"
description = "AWS IAM privilege-escalation path finder and least-privilege policy generator from CloudTrail."
license = "MIT"
readme = "README.md"
repository = "https://github.com/ahmed-raza-shaikh/iamladder"
homepage = "https://github.com/ahmed-raza-shaikh/iamladder"
keywords = ["aws", "iam", "least-privilege", "cloud-security", "cloudtrail"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Ahmed Raza Shaikh"]
exclude = ["assets/*", "target/*"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "analyze"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
