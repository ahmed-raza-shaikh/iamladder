<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title desc"><title id="title">IAMLadder</title><desc id="desc">Benchmarks: IAMLadder</desc><defs><style>@font-face{font-family:'geist-400-0';src:url(data:font/woff;base64,) format('woff');font-weight:400}@font-face{font-family:'geist-500-0';src:url(data:font/woff;base64,) format('woff');font-weight:500}@font-face{font-family:'geistmono-500-0';src:url(data:font/woff;base64,) format('woff');font-weight:500}.cap{font-family:'geist-400-0',system-ui,sans-serif;font-weight:400;font-size:13px;fill:#A3A9B8;letter-spacing:0.0em;}.lead{font-family:'geist-500-0',system-ui,sans-serif;font-weight:500;font-size:64px;fill:#EEF0F5;letter-spacing:-0.03em;}.unit{font-family:'geist-400-0',system-ui,sans-serif;font-weight:400;font-size:20px;fill:#A3A9B8;letter-spacing:0.0em;}.note{font-family:'geist-400-0',system-ui,sans-serif;font-weight:400;font-size:13px;fill:#7A8296;letter-spacing:0.0em;}.rl{font-family:'geist-400-0',system-ui,sans-serif;font-weight:400;font-size:15px;fill:#EEF0F5;letter-spacing:0.0em;}.rv{font-family:'geistmono-500-0',system-ui,sans-serif;font-weight:500;font-size:15px;fill:#EEF0F5;letter-spacing:0.0em;}.rn{font-family:'geist-400-0',system-ui,sans-serif;font-weight:400;font-size:13px;fill:#7A8296;letter-spacing:0.0em;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}text{font-variant-numeric:tabular-nums;font-kerning:normal}</style></defs><rect width="960" height="232" rx="16" fill="#0B0D14"/><rect x="0.5" y="0.5" width="959" height="231" rx="15.5" fill="none" stroke="rgba(238,240,245,0.09)"/><text class="cap" x="40.0" y="56.0" xml:space="preserve" >Analysis speed</text><text class="lead" x="38.0" y="128.0" xml:space="preserve" >49</text><text class="unit" x="121.2" y="128.0" xml:space="preserve" >ms</text><text class="note" x="40.0" y="164.0" xml:space="preserve" >10,000 IAM identities with six statements each,</text><text class="no